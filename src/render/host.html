<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>agent-mv-studio</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111110;
        overflow: hidden;
        font: 13px/1.4 'JetBrains Mono', Consolas, monospace;
        color: #cfc9bc;
      }
      #stage {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        outline: none;
      }
      body.preview canvas {
        height: calc(100% - 64px);
        object-fit: contain;
      }
      #bar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 64px;
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 0 18px;
        background: #1a1a18;
        border-top: 1px solid #33332f;
        box-sizing: border-box;
      }
      body.export #bar,
      body:not(.preview) #bar {
        display: none;
      }
      button {
        background: #d97757;
        color: #1a1a18;
        border: 0;
        border-radius: 4px;
        padding: 7px 14px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      #seek {
        flex: 1;
        accent-color: #d97757;
      }
      #hud {
        position: absolute;
        top: 10px;
        left: 12px;
        padding: 4px 8px;
        background: rgba(0, 0, 0, 0.55);
        border: 1px solid #33332f;
        border-radius: 3px;
        font-size: 11px;
        letter-spacing: 0.04em;
        pointer-events: none;
      }
      #hud.hidden {
        display: none;
      }
      #status {
        position: absolute;
        top: 10px;
        right: 12px;
        max-width: 60vw;
        font-size: 11px;
        opacity: 0.7;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      body.export #status {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="c"></canvas></div>
    <div id="hud">booting…</div>
    <div id="status"></div>
    <div id="bar">
      <button id="play">▶ play</button>
      <input id="seek" type="range" min="0" max="1" step="0.01" value="0" />
    </div>
    <script type="module" src="/host/host.js"></script>
  </body>
</html>
